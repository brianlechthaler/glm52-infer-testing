services:
  glm52-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:glm52}
    container_name: glm52-vllm
    restart: unless-stopped
    ipc: host
    shm_size: "32gb"
    ulimits:
      memlock: -1
      stack: 67108864
    ports:
      - "${VLLM_PORT:-8000}:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      # Skip DeepGEMM JIT warmup for faster container start; kernels compile on first request.
      VLLM_DEEP_GEMM_WARMUP: skip
      # NCCL tuning for multi-GPU on PCIe (no NVLink on this node class)
      NCCL_P2P_DISABLE: "0"
      NCCL_IB_DISABLE: "1"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    command:
      - ${MODEL:-nvidia/GLM-5.2-NVFP4}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${SERVED_MODEL_NAME:-glm-5.2}
      - --trust-remote-code
      - --tensor-parallel-size
      - "${TENSOR_PARALLEL_SIZE:-8}"
      - --enable-expert-parallel
      - --kv-cache-dtype
      - ${KV_CACHE_DTYPE:-fp8_e4m3}
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.95}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-32}"
      - --max-model-len
      - "${MAX_MODEL_LEN:-262144}"
      - --speculative-config.method
      - mtp
      - --speculative-config.num_speculative_tokens
      - "${MTP_SPECULATIVE_TOKENS:-5}"
      - --tool-call-parser
      - glm47
      - --reasoning-parser
      - glm45
      - --enable-auto-tool-choice
      - --enable-chunked-prefill
      - --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 30m
